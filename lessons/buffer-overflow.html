<html lang="ja">

<title>バッファオーバーフロー · VECTOR</title>
<style>
  .topnav { font-family: ui-monospace, monospace; font-size: 13px; padding: 12px 20px;
    border-bottom: 1px solid #1e2a45; display: flex; gap: 14px; align-items: center; background:#070a12; }
  .topnav a { color: #35e0ff; text-decoration: none; }
  .topnav a:hover { text-shadow: 0 0 10px #35e0ff; }
  .topnav .sep { color:#2b3a5a; } .topnav .tag { color:#75879f; }

<body>
<nav class="topnav"><a href="../index.html">◂ VECTOR</a><span class="sep">/</span><span class="tag">バッファオーバーフロー</span></nav>
<style>
  :root {
    --bg:#070a12; --panel:#0d1424; --panel2:#111a30; --line:#1e2a45;
    --ink:#dbe6f2; --dim:#75879f;
    --cyan:#35e0ff; --amber:#ffc24b; --red:#ff466e; --green:#56ffa6; --purple:#9b7bff;
    --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans JP", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin:0; background: radial-gradient(1100px 560px at 50% -12%, #0e1730 0%, transparent 62%), var(--bg);
    color: var(--ink); font-family: var(--sans); line-height: 1.6; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 30px 20px 60px; }
  .kicker { font-family: var(--mono); font-size: 12px; letter-spacing:.24em; text-transform:uppercase; color: var(--cyan); display:flex; align-items:center; gap:9px; }
  .kicker .dot { width:8px; height:8px; border-radius:50%; background: var(--green); box-shadow:0 0 12px var(--green); animation: blink 1.5s steps(2) infinite; }
  @keyframes blink { 50% { opacity:.2; } }
  h1 { font-family: var(--mono); font-weight:700; font-size: clamp(23px,3.6vw,33px); margin:12px 0 6px; color:#eef4fc; text-wrap:balance; }
  h1 .hl { color: var(--red); }
  .sub { color: var(--dim); font-size:15px; max-width:60ch; margin:0; }

  .rail { display:flex; gap:6px; margin:20px 0; }
  .rail .seg { flex:1; height:3px; border-radius:2px; background: var(--line); }
  .rail .seg.done { background: var(--cyan); }
  .rail .seg.active { background: linear-gradient(90deg, var(--cyan), var(--red)); }

  .scene { position:relative; background: linear-gradient(180deg, var(--panel), var(--panel2)); border:1px solid var(--line); border-radius:15px; overflow:hidden; box-shadow: 0 24px 70px -34px #000, inset 0 1px 0 rgba(255,255,255,.03); }
  canvas { display:block; width:100%; height:auto; }

  .narr { margin-top:22px; min-height:78px; }
  .narr .no { font-family: var(--mono); font-size:12px; color: var(--purple); letter-spacing:.16em; text-transform:uppercase; }
  .narr h2 { font-size:20px; margin:6px 0 8px; color:#eef4fc; text-wrap:balance; }
  .narr p { margin:0; color:#b4c2d6; font-size:15px; max-width:66ch; }

  .controls { display:flex; gap:11px; margin-top:22px; align-items:center; }
  button { font-family: var(--mono); font-size:14px; cursor:pointer; border-radius:9px; padding:10px 18px; border:1px solid var(--line); background:#0c1326; color: var(--ink); transition: all .18s; }
  button:hover:not(:disabled) { border-color: var(--cyan); color: var(--cyan); box-shadow:0 0 16px -6px var(--cyan); }
  button.primary { background: linear-gradient(90deg, rgba(53,224,255,.16), rgba(255,70,110,.16)); border-color: var(--cyan); color:#eef4fc; }
  button:disabled { opacity:.35; cursor:not-allowed; }
  button:focus-visible { outline:2px solid var(--purple); outline-offset:2px; }
  .count { margin-left:auto; font-family: var(--mono); font-size:13px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .foot { margin-top:24px; font-size:12px; color: var(--dim); text-align:center; font-family: var(--mono); }
  @media (prefers-reduced-motion: reduce) { .kicker .dot { animation:none; } }
</style>

<div class="wrap">
  <div class="kicker"><span class="dot"></span>VECTOR · memory corruption</div>
  <h1>スタック<span class="hl">バッファオーバーフロー</span></h1>
  <p class="sub">入力がバッファの容れ物からあふれ、隣にある「戻り先アドレス」まで塗り替える。プログラムが次にどこへ飛ぶかが、書き換えられる瞬間を見る。</p>

  <div class="rail" id="rail" aria-hidden="true"></div>

  <div class="scene"><canvas id="c" aria-label="バッファがあふれて戻り先アドレスを上書きするアニメーション"></canvas></div>

  <div class="narr">
    <div class="no" id="no"></div>
    <h2 id="title"></h2>
    <p id="body"></p>
  </div>

  <div class="controls">
    <button id="prev">‹ 戻る</button>
    <button id="next" class="primary">次へ ›</button>
    <button id="auto">▶ 自動再生</button>
    <span class="count" id="count"></span>
  </div>
  <div class="foot">VECTOR — 2D interactive · メモリの並びは x86-64 のスタックフレームに対応</div>
</div>

<script>
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  let DPR = Math.min(devicePixelRatio || 1, 2), W, H;
  const LOGW = 900, LOGH = 440;
  function resize() {
    const cw = cv.clientWidth || cv.parentElement.clientWidth;
    cv.style.height = (cw * LOGH / LOGW) + "px";
    cv.width = cw * DPR; cv.height = cw * LOGH / LOGW * DPR; W = cv.width; H = cv.height;
  }
  const S = () => W / LOGW;
  function rr(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
  function neon(c, b) { ctx.shadowColor = c; ctx.shadowBlur = b; }
  const noG = () => ctx.shadowBlur = 0;

  // phases
  const P = [
    { no:"01 / 正常", title:"入力が容れ物に収まる", target:4, mode:"safe", canary:false,
      body:"buf は 8 個ぶんの容れ物。短い入力はその中に収まり、隣の「戻り先アドレス」は無傷。プログラムは正しい場所（main）へ戻る。" },
    { no:"02 / あふれる", title:"あふれて戻り先を塗り替える", target:14, mode:"crash", canary:false,
      body:"長すぎる入力は buf を越え、あふれた分が隣のセル——保存された「戻り先アドレス」——まで塗りつぶす。上向きの矢印（次に飛ぶ先）が main から外れ、無効な番地へ。結果はクラッシュ。" },
    { no:"03 / 奪取", title:"あふれ方を“仕込む”と乗っ取れる", target:14, mode:"hijack", canary:false,
      body:"ただ潰すのではなく、あふれる中身を調整して、戻り先アドレスの位置に攻撃者のコード（win）の番地を置く。矢印はそこへ向き直り、プログラムは攻撃者の手の中へ。これが制御奪取。" },
    { no:"04 / 対策", title:"あふれても“飛ぶ前に”止める", target:10, mode:"guard", canary:true,
      body:"buf と戻り先の間に見張り（スタックカナリア＝乱数）を置く。あふれると必ず見張りを踏むので、戻る直前に改変を検知して強制終了。矢印は動かせない。" },
  ];

  // layout of cells for a phase
  function cells(canary) {
    const a = [];
    for (let k = 0; k < 8; k++) a.push("buf");
    if (canary) a.push("canary");
    a.push("rbp"); a.push("rbp");
    a.push("ret"); a.push("ret"); a.push("ret");
    return a;
  }

  let i = 0, filled = 0, arrow = 0, timer = null, tphase = 0;
  const el = (id) => document.getElementById(id);
  el("rail").innerHTML = P.map(() => '<div class="seg"></div>').join("");

  function cellColor(region, ph, hot) {
    if (region === "buf") return "#35e0ff";
    if (region === "canary") return hot ? "#ff466e" : "#ffc24b";
    if (ph.mode === "hijack") return region === "ret" ? "#56ffa6" : "#54637f";
    return "#ff466e"; // crash / overflow
  }
  // arrow target index: 0 main / 1 crash / 2 win  (switches when overflow reaches ret)
  function arrowTarget(ph, reachedRet) {
    if (ph.mode === "hijack") return reachedRet ? 2 : 0;
    if (ph.mode === "crash") return reachedRet ? 1 : 0;
    return 0;
  }

  function frame() {
    ctx.clearRect(0, 0, W, H);
    const s = S(), ph = P[i], list = cells(ph.canary);
    const n = list.length;
    const cw = 40 * s, gap = 5 * s, totalW = n * cw + (n - 1) * gap;
    const x0 = (W - totalW) / 2, cy = H * 0.62, ch = 46 * s;

    // ease fill + arrow
    filled += (ph.target - filled) * 0.06;
    const retStart = 8 + (ph.canary ? 1 : 0) + 2;
    const reachedRet = filled >= retStart + 0.5;
    const tgt = arrowTarget(ph, reachedRet);
    arrow += (tgt - arrow) * 0.12;

    // targets row (main / crash / win)
    const targets = [
      { label: "main()", ico: "✓", col: "#35e0ff" },
      { label: "0x4141…", ico: "💥", col: "#ff466e" },
      { label: "win()", ico: "🐚", col: "#56ffa6" },
    ];
    const ty = H * 0.16, tw = 150 * s;
    const txs = [W * 0.30, W * 0.5, W * 0.70];
    ctx.font = `${13 * s}px ${mono()}`; ctx.textAlign = "center";
    targets.forEach((t, k) => {
      const active = Math.abs(arrow - k) < 0.5;
      ctx.globalAlpha = active ? 1 : 0.32;
      neon(t.col, active ? 18 : 0);
      ctx.strokeStyle = t.col; ctx.fillStyle = "rgba(6,10,18,.7)"; ctx.lineWidth = 1.5 * s;
      rr(txs[k] - tw / 2, ty - 16 * s, tw, 32 * s, 8 * s); ctx.fill(); ctx.stroke(); noG();
      ctx.fillStyle = t.col; ctx.fillText(`${t.ico} ${t.label}`, txs[k], ty + 4 * s);
    });
    ctx.globalAlpha = 1;

    // control-flow arrow from ret group up to the (eased) target
    const retCx = x0 + (retStart + 1.5) * (cw + gap);
    const ax = txs[0] + (arrow) * ( (txs[1]-txs[0]) ); // approximate along 0..2 using segment widths
    const axInterp = (a) => { const k = Math.max(0, Math.min(2, a)); const lo = Math.floor(k), hi = Math.min(2, lo+1); return txs[lo] + (txs[hi]-txs[lo])*(k-lo); };
    const headX = axInterp(arrow);
    const arColT = targets[Math.round(arrow)].col;
    ctx.strokeStyle = arColT; ctx.lineWidth = 2.4 * s; neon(arColT, 12);
    ctx.beginPath();
    ctx.moveTo(retCx, cy - 6 * s);
    ctx.bezierCurveTo(retCx, cy - 60 * s, headX, ty + 90 * s, headX, ty + 22 * s);
    ctx.stroke();
    // arrowhead
    ctx.beginPath(); ctx.moveTo(headX, ty + 16 * s); ctx.lineTo(headX - 6 * s, ty + 26 * s); ctx.lineTo(headX + 6 * s, ty + 26 * s); ctx.closePath(); ctx.fillStyle = arColT; ctx.fill(); noG();
    // "RET →" label
    ctx.fillStyle = "#75879f"; ctx.font = `${11 * s}px ${mono()}`; ctx.textAlign = "left";
    ctx.fillText("ret ▸ 次に飛ぶ先", retCx + 8 * s, cy - 30 * s);

    // region brackets/labels under cells
    function regionSpan(name) { let a = -1, b = -1; list.forEach((r, k) => { if (r === name) { if (a < 0) a = k; b = k; } }); return [a, b]; }
    const labels = [["buf", "buf[8]", "#35e0ff"], ["ret", "return address", "#ffc24b"]];
    if (ph.canary) labels.push(["canary", "canary", "#ffc24b"]);

    // cells
    for (let k = 0; k < n; k++) {
      const x = x0 + k * (cw + gap), region = list[k];
      const isFilled = k < Math.floor(filled);
      const partial = k === Math.floor(filled) ? (filled - Math.floor(filled)) : 0;
      const overwritten = isFilled && region !== "buf";
      const hotCanary = region === "canary" && (isFilled || partial > 0);
      // base cell
      ctx.lineWidth = 1.3 * s;
      ctx.strokeStyle = region === "ret" ? "rgba(255,194,75,.55)" : (region === "buf" ? "rgba(53,224,255,.5)" : "rgba(120,150,200,.3)");
      ctx.fillStyle = "rgba(8,14,26,.7)";
      rr(x, cy, cw, ch, 6 * s); ctx.fill(); ctx.stroke();
      // fill
      if (isFilled || partial > 0) {
        const col = cellColor(region, ph, hotCanary);
        ctx.globalAlpha = isFilled ? 1 : partial;
        neon(col, overwritten || hotCanary ? 16 : 8); ctx.fillStyle = col;
        rr(x + 3 * s, cy + 3 * s, cw - 6 * s, ch - 6 * s, 4 * s); ctx.fill(); noG();
        ctx.globalAlpha = 1;
      }
    }

    // region labels
    ctx.textAlign = "center"; ctx.font = `${11 * s}px ${mono()}`;
    labels.forEach(([name, text, col]) => {
      const [a, b] = regionSpan(name); if (a < 0) return;
      const xa = x0 + a * (cw + gap), xb = x0 + b * (cw + gap) + cw;
      ctx.strokeStyle = col + "88"; ctx.lineWidth = 1 * s;
      ctx.beginPath(); ctx.moveTo(xa, cy + ch + 8 * s); ctx.lineTo(xb, cy + ch + 8 * s); ctx.stroke();
      ctx.fillStyle = col; ctx.fillText(text, (xa + xb) / 2, cy + ch + 24 * s);
    });

    // incoming stream (motion): blocks sliding toward the fill front
    const front = x0 + Math.floor(filled) * (cw + gap);
    if (filled < ph.target - 0.3) {
      for (let b = 1; b <= 3; b++) {
        const bx = front - b * (cw + gap) * 1.3 - ((Date.now() / 6) % (cw + gap));
        if (bx < x0 - cw) continue;
        ctx.globalAlpha = 0.5 / b; ctx.fillStyle = "#35e0ff"; neon("#35e0ff", 10);
        rr(bx, cy + 8 * s, cw - 6 * s, ch - 16 * s, 4 * s); ctx.fill(); noG();
      }
      ctx.globalAlpha = 1;
    }

    // guard shield flash
    if (ph.mode === "guard" && filled > 8.5) {
      ctx.globalAlpha = 0.5 + 0.5 * Math.abs(Math.sin(Date.now() / 200));
      ctx.font = `${20 * s}px ${mono()}`; ctx.fillStyle = "#ffc24b"; ctx.textAlign = "center";
      ctx.fillText("🛡 stack smashing detected → abort", W / 2, cy - 70 * s);
      ctx.globalAlpha = 1;
    }

    ctx.textAlign = "left";
    requestAnimationFrame(frame);
  }
  function mono() { return "ui-monospace, monospace"; }

  function render() {
    filled = 0; // re-animate the fill on each phase
    const ph = P[i];
    el("no").textContent = ph.no; el("title").textContent = ph.title; el("body").textContent = ph.body;
    [...el("rail").children].forEach((sg, k) => sg.className = "seg" + (k < i ? " done" : k === i ? " active" : ""));
    el("count").textContent = `${String(i + 1).padStart(2, "0")} / ${String(P.length).padStart(2, "0")}`;
    el("prev").disabled = i === 0; el("next").disabled = i === P.length - 1;
  }
  function go(n) { i = Math.max(0, Math.min(P.length - 1, n)); render(); }
  function stop() { if (timer) { clearInterval(timer); timer = null; el("auto").textContent = "▶ 自動再生"; } }
  el("next").onclick = () => { stop(); go(i + 1); };
  el("prev").onclick = () => { stop(); go(i - 1); };
  el("auto").onclick = () => {
    if (timer) return stop();
    if (i === P.length - 1) go(0);
    el("auto").textContent = "⏸ 停止";
    timer = setInterval(() => { if (i >= P.length - 1) return stop(); go(i + 1); }, 4200);
  };
  document.addEventListener("keydown", (e) => { if (e.key === "ArrowRight") { stop(); go(i + 1); } if (e.key === "ArrowLeft") { stop(); go(i - 1); } });

  new ResizeObserver(resize).observe(cv.parentElement);
  resize(); render(); requestAnimationFrame(frame);
</script>

</body>
</html>
