<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>バッファオーバーフロー · VECTOR</title>
<style>
  .topnav { font-family: ui-monospace, monospace; font-size: 13px; padding: 12px 20px;
    border-bottom: 1px solid #1e2a45; display: flex; gap: 14px; align-items: center; background:#070a12; }
  .topnav a { color: #35e0ff; text-decoration: none; }
  .topnav a:hover { text-shadow: 0 0 10px #35e0ff; }
  .topnav .sep { color:#2b3a5a; } .topnav .tag { color:#75879f; }
</style>
</head>
<body>
<nav class="topnav"><a href="../index.html">◂ VECTOR</a><span class="sep">/</span><span class="tag">バッファオーバーフロー</span></nav>
<style>
  :root {
    --bg:#070a12; --panel:#0d1424; --panel2:#111a30; --line:#1e2a45;
    --ink:#dbe6f2; --dim:#75879f;
    --cyan:#35e0ff; --amber:#ffc24b; --red:#ff466e; --green:#56ffa6; --purple:#9b7bff;
    --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans JP", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin:0; background: radial-gradient(1100px 560px at 50% -12%, #0e1730 0%, transparent 62%), var(--bg);
    color: var(--ink); font-family: var(--sans); line-height: 1.6; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 940px; margin: 0 auto; padding: 30px 20px 60px; }

  .kicker { font-family: var(--mono); font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: var(--cyan); display:flex; align-items:center; gap:9px; }
  .kicker .dot { width:8px; height:8px; border-radius:50%; background: var(--green); box-shadow:0 0 12px var(--green); animation: blink 1.5s steps(2) infinite; }
  @keyframes blink { 50% { opacity:.2; } }
  h1 { font-family: var(--mono); font-weight: 700; font-size: clamp(23px, 3.6vw, 33px); margin: 12px 0 6px; color:#eef4fc; letter-spacing:-.01em; text-wrap: balance; }
  h1 .hl { color: var(--red); }
  .sub { color: var(--dim); font-size: 15px; max-width: 64ch; margin: 0; }

  .rail { display:flex; gap:6px; margin: 22px 0 22px; }
  .rail .seg { flex:1; height:3px; border-radius:2px; background: var(--line); }
  .rail .seg.done { background: var(--cyan); }
  .rail .seg.active { background: linear-gradient(90deg, var(--cyan), var(--red)); }

  .stage { display:grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 760px) { .stage { grid-template-columns: 1.05fr .95fr; align-items:start; } }

  .panel { background: linear-gradient(180deg, var(--panel), var(--panel2)); border:1px solid var(--line); border-radius: 13px; padding: 16px; }
  .plabel { font-family: var(--mono); font-size: 11px; letter-spacing:.2em; text-transform:uppercase; color: var(--dim); margin-bottom: 12px; }

  /* code */
  .code { font-family: var(--mono); font-size: 13.5px; line-height: 1.95; white-space: pre; overflow-x:auto; }
  .code .ln { display:block; padding: 0 8px; border-left: 2px solid transparent; border-radius: 3px; }
  .code .ln.on { background: rgba(53,224,255,.10); border-left-color: var(--cyan); }
  .code .ln.on.danger { background: rgba(255,70,110,.12); border-left-color: var(--red); }
  .code .kw { color: var(--cyan); } .code .fn { color: #c9d6e8; } .code .cmt { color: #4a5a78; } .code .str { color: var(--green); } .code .warn { color: var(--red); }

  /* control flow chip */
  .flow { margin-top: 14px; font-family: var(--mono); font-size: 13px; display:flex; align-items:center; gap:9px; padding:9px 12px; border-radius:9px; border:1px solid var(--line); color: var(--dim); }
  .flow b { color: var(--ink); font-weight:400; }
  .flow.ok { color: var(--cyan); border-color: rgba(53,224,255,.35); background: rgba(53,224,255,.06); }
  .flow.crash { color: var(--red); border-color: rgba(255,70,110,.4); background: rgba(255,70,110,.07); }
  .flow.pwn { color: var(--green); border-color: rgba(86,255,166,.4); background: rgba(86,255,166,.07); }
  .flow.guard { color: var(--amber); border-color: rgba(255,194,75,.4); background: rgba(255,194,75,.07); }

  /* input strip */
  .inputrow { font-family: var(--mono); font-size: 13px; margin-bottom: 14px; }
  .inputrow .lbl { color: var(--dim); }
  .bytes { display:flex; flex-wrap: wrap; gap: 3px; margin-top: 6px; }
  .byte { width: 22px; height: 22px; display:grid; place-items:center; font-family: var(--mono); font-size: 10.5px; border-radius: 4px; background:#0a1120; border:1px solid var(--line); color: var(--dim); }
  .byte.fill { color:#07101e; background: var(--cyan); border-color: var(--cyan); }
  .byte.pad { color:#07101e; background: #4a5a78; border-color:#4a5a78; }
  .byte.addr { color:#07101e; background: var(--green); border-color: var(--green); font-weight:700; }

  /* stack */
  .stack { display:flex; flex-direction: column; gap: 8px; }
  .addrcol { font-family: var(--mono); font-size: 10px; color: #3f4d6b; }
  .slot { position: relative; border:1px solid var(--line); border-radius: 9px; padding: 10px 12px; background:#0a1120; transition: border-color .35s, background .35s, box-shadow .35s; }
  .slot .name { font-family: var(--mono); font-size: 10.5px; letter-spacing:.1em; text-transform: uppercase; color: var(--dim); }
  .slot .val { font-family: var(--mono); font-size: 14px; margin-top: 3px; color: var(--ink); word-break: break-all; transition: color .35s; }
  .slot.buf { border-left: 3px solid var(--cyan); }
  .slot.written { box-shadow: inset 0 0 0 1px rgba(53,224,255,.3); }
  .slot.written .val { color: var(--cyan); }
  .slot.overwrite { border-color: var(--red); background: rgba(255,70,110,.08); box-shadow: 0 0 22px -8px var(--red); }
  .slot.overwrite .val { color: var(--red); font-weight: 700; }
  .slot.hijack { border-color: var(--green); background: rgba(86,255,166,.08); box-shadow: 0 0 22px -8px var(--green); }
  .slot.hijack .val { color: var(--green); font-weight: 700; }
  .slot.canary { border-color: var(--amber); }
  .slot.canary .val { color: var(--amber); }
  .slot.canary.overwrite { border-color: var(--red); }
  .slot .tag { position:absolute; right:10px; top:9px; font-family: var(--mono); font-size:10px; padding:2px 6px; border-radius:5px; }
  .tag-ret { background: rgba(255,194,75,.14); color: var(--amber); border:1px solid rgba(255,194,75,.4); }

  .narr { margin-top: 22px; min-height: 92px; }
  .narr .no { font-family: var(--mono); font-size: 12px; color: var(--purple); letter-spacing:.16em; text-transform: uppercase; }
  .narr h2 { font-size: 19px; margin: 6px 0 8px; color:#eef4fc; text-wrap: balance; }
  .narr p { margin:0; color:#b4c2d6; font-size: 15px; max-width: 68ch; }
  .narr code { font-family: var(--mono); background:#0a1120; border:1px solid var(--line); padding:1px 6px; border-radius:5px; color: var(--amber); font-size:13px; }

  .controls { display:flex; gap: 11px; margin-top: 24px; align-items:center; }
  button { font-family: var(--mono); font-size: 14px; cursor:pointer; border-radius:9px; padding:10px 18px; border:1px solid var(--line); background:#0c1326; color: var(--ink); transition: all .18s; }
  button:hover:not(:disabled) { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 16px -6px var(--cyan); }
  button.primary { background: linear-gradient(90deg, rgba(53,224,255,.16), rgba(255,70,110,.16)); border-color: var(--cyan); color:#eef4fc; }
  button:disabled { opacity:.35; cursor:not-allowed; }
  button:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
  .count { margin-left:auto; font-family: var(--mono); font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .foot { margin-top: 26px; font-size: 12px; color: var(--dim); text-align:center; font-family: var(--mono); }
  @media (prefers-reduced-motion: reduce) { * { animation:none!important; transition:none!important; } }
</style>

<div class="wrap">
  <div class="kicker"><span class="dot"></span>VECTOR · memory corruption</div>
  <h1>スタック<span class="hl">バッファオーバーフロー</span></h1>
  <p class="sub">境界チェックの無いコピーが、バッファの外——保存された戻り先アドレス——まで書き換え、プログラムの制御を奪う。スタックのメモリが1手ずつどう壊れるかを見る。</p>

  <div class="rail" id="rail" aria-hidden="true"></div>

  <div class="stage">
    <!-- LEFT: code + input + flow -->
    <div class="panel">
      <div class="plabel">vulnerable function</div>
      <div class="code" id="code"></div>

      <div class="inputrow" style="margin-top:16px">
        <span class="lbl">input ▸</span> <span id="inlabel" style="color:var(--ink)"></span>
        <div class="bytes" id="bytes"></div>
      </div>

      <div class="flow" id="flow"></div>
    </div>

    <!-- RIGHT: stack -->
    <div class="panel">
      <div class="plabel">stack — 高位アドレス ↑ / strcpy は buf から上へ書き込む</div>
      <div class="stack" id="stack"></div>
    </div>
  </div>

  <div class="narr">
    <div class="no" id="no"></div>
    <h2 id="ntitle"></h2>
    <p id="nbody"></p>
  </div>

  <div class="controls">
    <button id="prev">‹ 戻る</button>
    <button id="next" class="primary">次へ ›</button>
    <button id="auto">▶ 自動再生</button>
    <span class="count" id="count"></span>
  </div>

  <div class="foot">VECTOR — 2D interactive · スタックの挙動は実際の x86-64 呼び出し規約の論理に対応</div>
</div>

<script>
  const CODE = [
    ['<span class="kw">void</span> <span class="fn">vuln</span>(<span class="kw">char</span> *input) {', null],
    ['    <span class="kw">char</span> buf[<span class="str">8</span>];', 'buf'],
    ['    <span class="fn">strcpy</span>(buf, input);   <span class="warn">// 境界チェック無し</span>', 'copy'],
    ['    <span class="kw">return</span>;              <span class="cmt">// 戻り先アドレスを RIP に取り出す</span>', 'ret'],
    ['}', null],
  ];

  // each slot: {val, cls}  cls in '', 'written', 'overwrite', 'hijack'
  const STEPS = [
    {
      code: 'copy', danger: false,
      inlabel: '"AAAA"  (4 bytes)',
      bytes: [['41','fill'],['41','fill'],['41','fill'],['41','fill']],
      buf: {val:'41 41 41 41 00 .. ..', cls:'written'},
      rbp: {val:'(intact)', cls:''}, ret: {val:'→ main+0x2c', cls:''},
      flow: ['ok', 'RET → ', 'main（正常に呼び出し元へ戻る）'],
      no:'01 / 正常', title:'まず正しく収まる入力',
      body:'buf は8バイト。4バイトの入力は buf の中に収まり、隣の <code>saved RBP</code> や <code>return address</code> は無傷。<code>ret</code> は正しい戻り先を取り出し、関数は普通に返る。',
    },
    {
      code: 'copy', danger: false,
      inlabel: '"AAAAAAAA"  (8 bytes)',
      bytes: Array(8).fill(['41','fill']),
      buf: {val:'41 41 41 41 41 41 41 41', cls:'written'},
      rbp: {val:'(intact)', cls:''}, ret: {val:'→ main+0x2c', cls:''},
      flow: ['ok', 'RET → ', 'main（まだギリギリ無事）'],
      no:'02 / 境界', title:'ちょうど buf を満タンにする',
      body:'8バイトで buf は満杯。まだ隣までは侵していない。ここまでが「境界の内側」。あと1バイトでも増えると、行き先は buf の外になる。',
    },
    {
      code: 'copy', danger: true,
      inlabel: '"A"×20  (20 bytes)',
      bytes: Array(20).fill(['41', 'fill']),
      buf: {val:'41 41 41 41 41 41 41 41', cls:'written'},
      rbp: {val:'41 41 41 41 41 41 41 41', cls:'overwrite'},
      ret: {val:'0x0000000041414141', cls:'overwrite'},
      flow: ['crash', 'RET → ', '0x41414141  ✗ SEGV（無効アドレス）'],
      no:'03 / 溢れる', title:'buf の外まで書き込まれる',
      body:'20バイトは buf(8)を溢れ、隣の <code>saved RBP</code>、さらに <code>return address</code> まで <code>0x41</code> で上書きする。境界チェックが無い <code>strcpy</code> は「どこまで書くか」を止められない。<code>ret</code> は壊れた <code>0x41414141</code> へジャンプ → クラッシュ。',
    },
    {
      code: 'ret', danger: true,
      inlabel: '"B"×16 + &win  (16 pad + 8 addr)',
      bytes: [...Array(16).fill(['42','pad']), ['a6','addr'],['11','addr'],['40','addr'],['00','addr']],
      buf: {val:'42 42 42 42 42 42 42 42', cls:'written'},
      rbp: {val:'42 42 42 42 42 42 42 42', cls:'overwrite'},
      ret: {val:'0x00000000004011a6', cls:'hijack'},
      flow: ['pwn', 'RET → ', 'win()  🔓 制御奪取'],
      no:'04 / 奪取', title:'戻り先を「狙った場所」に書き換える',
      body:'ゴミで潰すのではなく、<code>return address</code> の位置に <code>win()</code> のアドレス(<code>0x4011a6</code>)を精密に置く。パディング16バイトで buf と saved RBP を埋め、続く8バイトが戻り先になる。<code>ret</code> は攻撃者が選んだ <code>win()</code> へ飛び、シェルが起動する。これが制御フロー奪取。',
    },
    {
      code: 'copy', danger: false, canary: true,
      inlabel: '"A"×20  (対策あり)',
      bytes: Array(20).fill(['41','fill']),
      buf: {val:'41 41 41 41 41 41 41 41', cls:'written'},
      canary: {val:'41 41 41 41 …  ✗ 改変検出', cls:'overwrite'},
      rbp: {val:'(到達前に abort)', cls:''}, ret: {val:'(守られた)', cls:''},
      flow: ['guard', 'RET 前に ', '__stack_chk_fail  🛡 abort'],
      no:'05 / 対策', title:'直し方：溢れても“戻る前に”止める',
      body:'buf と saved RBP の間に <code>スタックカナリア</code>(乱数)を置く。オーバーフローは必ずカナリアを踏むので、<code>ret</code> の直前に値の変化を検出して <code>__stack_chk_fail</code> で強制終了する。根本対策は境界チェック(<code>strncpy</code>/<code>snprintf</code>)、加えて ASLR・非実行スタック・カナリアの多層防御。',
    },
  ];

  const el = (id) => document.getElementById(id);
  let i = 0, timer = null;

  el('rail').innerHTML = STEPS.map(() => '<div class="seg"></div>').join('');

  function renderCode(active, danger) {
    el('code').innerHTML = CODE.map(([html, key]) => {
      const on = key === active || (active === 'copy' && key === 'copy') || (active === 'ret' && key === 'ret')
        || (active === 'copy' && key === 'buf' && false);
      const cls = 'ln' + (key && key === active ? ' on' + (danger ? ' danger' : '') : '');
      return `<span class="${cls}">${html}</span>`;
    }).join('');
  }

  function slot(name, s, extraCls, tag) {
    const cls = 'slot ' + (extraCls || '') + ' ' + (s.cls || '');
    const t = tag ? `<span class="tag ${tag[1]}">${tag[0]}</span>` : '';
    return `<div class="${cls}">${t}<div class="name">${name}</div><div class="val">${s.val}</div></div>`;
  }

  function render() {
    const s = STEPS[i];
    renderCode(s.code, s.danger);

    el('inlabel').textContent = s.inlabel;
    el('bytes').innerHTML = s.bytes.slice(0, 28).map(([h, c]) => `<span class="byte ${c}">${h}</span>`).join('')
      + (s.bytes.length > 28 ? '<span class="byte">…</span>' : '');

    const rows = [];
    rows.push(slot('return address  (saved RIP)', s.ret, s.ret.cls === 'hijack' ? 'hijack' : (s.ret.cls === 'overwrite' ? 'overwrite' : ''), ['RET', 'tag-ret']));
    rows.push(slot('saved RBP', s.rbp, ''));
    if (s.canary) rows.push(slot('stack canary  (乱数)', s.canary, 'canary'));
    rows.push(slot('buf[8]', s.buf, 'buf'));
    el('stack').innerHTML = rows.join('');

    const [fc, a, b] = s.flow;
    el('flow').className = 'flow ' + fc;
    el('flow').innerHTML = `${a}<b>${b}</b>`;

    el('no').textContent = s.no;
    el('ntitle').textContent = s.title;
    el('nbody').innerHTML = s.body;

    [...el('rail').children].forEach((seg, k) => seg.className = 'seg' + (k < i ? ' done' : k === i ? ' active' : ''));
    el('count').textContent = `${String(i + 1).padStart(2, '0')} / ${String(STEPS.length).padStart(2, '0')}`;
    el('prev').disabled = i === 0;
    el('next').disabled = i === STEPS.length - 1;
  }

  function go(n) { i = Math.max(0, Math.min(STEPS.length - 1, n)); render(); }
  function stop() { if (timer) { clearInterval(timer); timer = null; el('auto').textContent = '▶ 自動再生'; } }
  el('next').onclick = () => { stop(); go(i + 1); };
  el('prev').onclick = () => { stop(); go(i - 1); };
  el('auto').onclick = () => {
    if (timer) return stop();
    if (i === STEPS.length - 1) go(0);
    el('auto').textContent = '⏸ 停止';
    timer = setInterval(() => { if (i >= STEPS.length - 1) return stop(); go(i + 1); }, 3800);
  };
  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') { stop(); go(i + 1); }
    if (e.key === 'ArrowLeft') { stop(); go(i - 1); }
  });

  render();
</script>

</body>
</html>
